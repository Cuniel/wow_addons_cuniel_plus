name: Package and release
on:
  push:
    branches: [main]
    paths:
      - 'Cuniel_plus/**'
      - 'tests/**'
      - 'tools/**'
      - 'release-notes/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate Lua and behavior
        run: |
          python tests/test_windows.py
          python tests/test_chattabs.py
          python tests/test_details_layout.py
          python tests/test_options.py
          python tests/test_slotlabels.py
          python tests/test_itemlevel_repair.py
          python tests/test_itemlevel_display.py
          python tests/test_itemcounts.py
          python tests/test_itemcount_filters.py
          python tests/test_release_notes.py
          python tools/release_notes.py
      - name: Read addon version
        id: version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = next(line.split(':', 1)[1].strip() for line in Path('Cuniel_plus/Cuniel_plus.toc').read_text().splitlines() if line.startswith('## Version:'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + version + '\n')
          PY
      - name: Build addon ZIP
        run: python tools/package.py
      - name: Publish version release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "release-notes/$tag.md"
          else
            gh release create "$tag" "dist/Cuniel_plus-$VERSION.zip" --target "$GITHUB_SHA" --title "Cuniel_plus $VERSION" --notes-file "release-notes/$tag.md"
          fi
      - name: Backfill authored notes for historical releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_notes.py --backfill
